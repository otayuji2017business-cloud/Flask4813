name: CI - Lint, Format, Type Check, Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint:
    name: Ruff Lint Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Ruff
        run: pip install ruff
      
      - name: Run Ruff lint
        run: ruff check app/ config.py wsgi.py

  format:
    name: Black Format Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Black
        run: pip install black
      
      - name: Check format with Black
        run: black --check app/ config.py wsgi.py

  type-check:
    name: mypy Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy
      
      - name: Run mypy type check
        run: mypy app/ config.py wsgi.py --ignore-missing-imports

  test:
    name: pytest Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run pytest tests
        run: pytest tests/ -v --cov=app --cov-report=html
      
      - name: Generate coverage report
        run: pytest tests/ --cov=app --cov-report=html
        if: always()
      
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
        if: always()

  # すべてのチェックが成功したことを確認
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, test]
    
    steps:
      - name: Verify all checks passed
        run: echo "✓ All checks passed successfully"
