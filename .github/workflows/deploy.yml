name: Deploy

on:
  push:
    branches: ['main']

jobs:
  test:
    name: Run Tests Before Deploy
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run pytest tests
        run: pytest tests/ -v
        
  build-and-deploy:
    name: Build Docker Image and Deploy
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker authentication
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev
      
      - name: Build Docker image
        run: |
          docker build -t asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/flask4813/web:latest \
            -t asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/flask4813/web:${{ github.sha }} \
            .
      
      - name: Push Docker image to Artifact Registry
        run: |
          docker push asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/flask4813/web:latest
          docker push asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/flask4813/web:${{ github.sha }}
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy flask4813-web \
            --image asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/flask4813/web:latest \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars FLASK_ENV=production
      
      - name: Get Cloud Run service URL
        run: |
          SERVICE_URL=$(gcloud run services describe flask4813-web --region asia-northeast1 --format='value(status.url)')
          echo "Deployment completed. Service URL: $SERVICE_URL"
      
      - name: Notify deployment status
        if: success()
        run: echo "✓ Deployment to Cloud Run succeeded"
      
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "✗ Deployment failed"
          exit 1
