name: Debug - Validate GCP Secrets

on:
  workflow_dispatch

jobs:
  debug:
    name: Debug GCP Authentication
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check if secrets are set
        run: |
          echo "=== Checking GitHub Secrets ==="
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "❌ GCP_PROJECT_ID is NOT set"
          else
            echo "✅ GCP_PROJECT_ID is set: ${{ secrets.GCP_PROJECT_ID }}"
          fi
          
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ GCP_SA_KEY is NOT set"
          else
            echo "✅ GCP_SA_KEY is set (length: $(echo -n '${{ secrets.GCP_SA_KEY }}' | wc -c) chars)"
          fi
      
      - name: Validate GCP_SA_KEY JSON format
        run: |
          echo "=== Validating GCP_SA_KEY JSON ==="
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa_key.json
          
          # Check if it's valid JSON
          if python3 -m json.tool /tmp/sa_key.json > /dev/null 2>&1; then
            echo "✅ GCP_SA_KEY is valid JSON"
            
            # Extract key fields
            PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/sa_key.json'))['project_id'])")
            CLIENT_EMAIL=$(python3 -c "import json; print(json.load(open('/tmp/sa_key.json'))['client_email'])")
            
            echo "  Project ID: $PROJECT_ID"
            echo "  Client Email: $CLIENT_EMAIL"
            
            # Check if project_id matches GCP_PROJECT_ID
            if [ "$PROJECT_ID" = "${{ secrets.GCP_PROJECT_ID }}" ]; then
              echo "✅ project_id in SA Key matches GCP_PROJECT_ID"
            else
              echo "❌ Mismatch!"
              echo "   SA Key project_id: $PROJECT_ID"
              echo "   Secret GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}"
            fi
          else
            echo "❌ GCP_SA_KEY is NOT valid JSON"
            echo "First 100 chars of GCP_SA_KEY:"
            echo '{{ secrets.GCP_SA_KEY }}' | head -c 100
          fi
          
          rm -f /tmp/sa_key.json
      
      - name: Try GCP authentication
        run: |
          echo "=== Attempting GCP Authentication ==="
          
          # Set up gcloud auth with provided key
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp_key.json
          
          if gcloud auth activate-service-account --key-file=/tmp/gcp_key.json 2>&1; then
            echo "✅ GCP Authentication successful"
            
            # List available projects
            echo ""
            echo "=== GCP Configuration ==="
            gcloud config list
            
            # Check active account
            echo ""
            echo "=== Active Account ==="
            gcloud auth list
            
          else
            echo "❌ GCP Authentication failed"
            echo "Error details above ↑"
          fi
          
          rm -f /tmp/gcp_key.json
      
      - name: Check Artifact Registry access
        run: |
          echo "=== Checking Artifact Registry Access ==="
          
          # Try to list repositories
          if gcloud artifacts repositories list --location=asia-northeast1 2>&1; then
            echo "✅ Can access Artifact Registry"
          else
            echo "❌ Cannot access Artifact Registry"
            echo "Error details above ↑"
          fi
