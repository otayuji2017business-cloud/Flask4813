{% extends "base.html" %}

{% block title %}ホーム - Flask4813 App{% endblock %}

{% block content %}
<form method="post">
    {{ csrf_token() }}
    <input type="text" name="name" placeholder="名前を入力してください" required>
    <button type="submit">保存</button>
</form>

{% if items %}
    <h2>登録済みの名前一覧</h2>
    <ul>
    {% for item in items %}
        <li>{{ item.name }}</li>
    {% endfor %}
    </ul>
{% else %}
    <p>まだ名前が登録されていません。</p>
{% endif %}
{% endblock %}
